    <script>
      const retry = document.getElementById('retry');
      const status = document.getElementById('status');
      let checking = false;
      async function checkConnection() {
        if (checking) return;
        checking = true; retry.disabled = true; status.textContent = 'Проверяем соединение…';
        try {
          const response = await fetch('/api/health?connection-check=1', { cache: 'no-store' });
          if (!response.ok) throw new Error('not ready');
          status.textContent = 'Связь восстановлена'; window.location.replace('/employee');
        } catch { status.textContent = 'Связи пока нет'; }
        finally { checking = false; retry.disabled = false; }
      }
      retry.addEventListener('click', checkConnection);
      window.addEventListener('online', checkConnection);
      window.setInterval(checkConnection, 10000);
      window.setTimeout(checkConnection, 800);
    </script>
